namespace: ecommerce

# serviceName: The name of the microservice to deploy (e.g., api-gateway, user-service)
# This should be set via --set serviceName=<service-name> during installation
# serviceName: api-gateway

image:
  repository: yourregistry
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 2

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

ingress:
  enabled: true
  host: example.com
  annotations: {}

service:
  type: ClusterIP
  port: 80

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

env:
  NODE_ENV: production
  MONGO_URI: "mongodb://mongo:27017/ecommerce"
  REDIS_URL: "redis://redis:6379"

secrets:
  # IMPORTANT: Replace with a real secret before deployment using --set secrets.jwtSecret=<your-secret>
  jwtSecret: "REPLACE_WITH_REAL_SECRET"
